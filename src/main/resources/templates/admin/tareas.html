<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #F3F4F6; }
    .card {
        margin-bottom: 1.5rem;
        border-radius: 1rem;
        border: 1px solid #9CA3AF;
    }
    .card-title { color: #1E3A8A; }
    .btn-primary { background-color: #3B82F6; border: none; }
  </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="container mt-4">
  <h2 class="mb-4" style="color: #1E3A8A;">Listado de Tareas</h2>
  <div class="row">
    <div class="col-12 mb-3">
      <a class="btn btn-primary" th:href="@{/admin/tareas/crear}">Crear Nueva Tarea</a>
    </div>
  </div>
  <div th:replace="fragments/back :: volver('/admin/dashboard')"></div>
  <div class="row" th:each="tarea : ${tareas}">
    <div class="col-md-6">
      <div class="card p-3">
        <h5 class="card-title" th:text="${tarea.nombre}">Nombre Tarea</h5>
        <p><strong>Creador:</strong> <span th:text="${tarea.creador.username}">Administrador</span></p>
        <p><strong>Fecha de Inicio:</strong> <span th:text="${#temporals.format(tarea.fechaInicio, 'dd/MM/yyyy')}">-</span></p>
        <p><strong>Fecha de Vencimiento:</strong> <span th:text="${#temporals.format(tarea.fechaVencimiento, 'dd/MM/yyyy')}">-</span></p>
        <p>
          <strong>Asignado a:</strong>
          <span th:if="${tarea.grupo != null}" th:text="${tarea.grupo.nombre}">Nombre del Grupo</span>
          <span th:if="${tarea.grupo == null && tarea.asignado != null}" th:text="${tarea.asignado.username}">Trabajador</span>
          <span th:if="${tarea.grupo == null && tarea.asignado == null}">Sin asignar</span>
        </p>
        <a th:href="@{'/admin/tareas/asignar/' + ${tarea.id}}" class="btn btn-sm btn-outline-primary mt-2">Asignar</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
