<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Tarea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #F3F4F6; }
        .form-container { max-width: 700px; margin: auto; margin-top: 50px; background-color: #FFFFFF; padding: 30px; border-radius: 1rem; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #3B82F6; border: none; }
        .card-title { color: #1E3A8A; }
    </style>
</head>
<body>
<div class="form-container">
    <h3 class="card-title mb-4">Crear nueva tarea</h3>
    <form th:action="@{/admin/tareas/crear}" method="post">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre de la tarea</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label for="fechaInicio" class="form-label">Fecha de inicio</label>
            <input type="date" class="form-control" id="fechaInicio" name="fechaInicio" required>
        </div>
        <div class="mb-3">
            <label for="fechaVencimiento" class="form-label">Fecha de vencimiento</label>
            <input type="date" class="form-control" id="fechaVencimiento" name="fechaVencimiento" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Crear Tarea</button>
    </form>
</div>
<script>
    if (window.history.replaceState) {
      window.history.replaceState(null, null, window.location.href);
    }
</script>
</body>
</html>
