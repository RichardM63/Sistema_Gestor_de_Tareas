<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Panel de Administración</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #F3F4F6;">
<div th:replace="fragments/header :: header"></div>
<div class="container mt-5">
  <h2 class="mb-4 text-center" style="color: #1E3A8A;">Bienvenido, Administrador</h2>
  <div class="row g-4">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h5 class="card-title">Usuarios</h5>
          <p>Administra cuentas de trabajadores.</p>
          <a th:href="@{/admin/usuarios}" class="btn btn-primary" style="background-color: #3B82F6;">Gestionar</a>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h5 class="card-title">Tareas</h5>
          <p>Crear y asignar tareas a trabajadores o grupos.</p>
          <a th:href="@{/admin/tareas}" class="btn btn-primary" style="background-color: #3B82F6;">Gestionar</a>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h5 class="card-title">Grupos</h5>
          <p>Organiza trabajadores en grupos.</p>
          <a th:href="@{/admin/grupos}" class="btn btn-primary" style="background-color: #3B82F6;">Gestionar</a>
        </div>
      </div>
    </div>
    <div class="container mt-5">
      <h3 class="text-center mb-4" style="color: #1E3A8A;">Estadísticas Recientes</h3>
      <div class="text-center">
        <a th:href="@{/admin/estadisticas}" class="btn btn-primary" style="background-color: #3B82F6;">Ver estadísticas detalladas</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
