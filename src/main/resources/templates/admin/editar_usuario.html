<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${title} ?: 'Editar Usuario'">Editar Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
        background-color: #F3F4F6;
    }
    .navbar {
        background-color: #1E3A8A;
    }
    .navbar-brand, .nav-link, .text-white {
        color: #FFFFFF !important;
    }
    .btn-primary {
        background-color: #3B82F6;
        border: none;
    }
    .card {
        border-radius: 1rem;
        border: 1px solid #9CA3AF;
    }
    .card-title {
        color: #1E3A8A;
    }
  </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="card-title text-center" style="color: #1E3A8A;">Editar Usuario</h3>
      <form th:action="@{'/admin/usuarios/editar/' + ${id}}" th:object="${usuario}" method="post">
        <div class="mb-3">
          <label for="username" class="form-label">Nombre de Usuario</label>
          <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="Ingrese el nombre de usuario" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Ingrese el correo electrónico" required>
        </div>

        <div class="mb-3">
          <label for="puesto" class="form-label">Puesto</label>
          <input type="text" id="puesto" th:field="*{puesto}" class="form-control" placeholder="Ingrese el puesto" required>
        </div>

        <div class="d-flex justify-content-between">
          <button type="submit" class="btn btn-primary">Guardar Cambios</button>
          <a href="#" th:href="@{/admin/usuarios}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
