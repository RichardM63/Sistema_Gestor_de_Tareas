<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #F3F4F6;">
<div th:replace="fragments/header :: header"></div>
<div class="container mt-4">
    <h3 style="color: #1E3A8A;">Usuarios</h3>
    <a th:href="@{/admin/usuarios/crear}" class="btn btn-primary mb-3" style="background-color: #3B82F6;">Crear Usuario</a>
    <div th:replace="fragments/back :: volver('/admin/dashboard')"></div>
    <table class="table table-hover mt-3">
        <thead class="table-dark">
        <tr>
            <th>Nombre de Usuario</th>
            <th>Rol</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.username}"></td>
            <td th:text="${usuario.rol}"></td>
            <td>
                <div class="d-flex">
                    <a class="btn btn-secondary btn-sm me-1" th:href="@{'/admin/usuarios/editar/' + ${usuario.id}}">Editar</a>

                    <!-- Mostrar botón Eliminar solo si es TRABAJADOR -->
                    <div th:if="${usuario.rol.name() == 'TRABAJADOR'}">
                        <button class="btn btn-danger btn-sm me-1"
                                data-bs-toggle="modal"
                                th:data-bs-target="'#confirmDeleteModal-' + ${usuario.id}">
                            Eliminar
                        </button>

                        <!-- Modal de confirmación -->
                        <div class="modal fade" th:id="'confirmDeleteModal-' + ${usuario.id}" tabindex="-1" aria-hidden="true">
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title">Confirmar eliminación</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                                    </div>
                                    <div class="modal-body">
                                        ¿Estás seguro que deseas eliminar al trabajador <strong th:text="${usuario.username}"></strong>? Esta acción no se puede deshacer.
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                        <a th:href="@{'/admin/usuarios/eliminar/' + ${usuario.id}}" class="btn btn-danger">Sí, eliminar</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
