<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Crear Grupo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #F3F4F6; }
    .form-container { max-width: 600px; margin: auto; margin-top: 50px; background-color: #FFFFFF; padding: 30px; border-radius: 1rem; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .btn-primary { background-color: #3B82F6; border: none; }
    .card-title { color: #1E3A8A; }
  </style>
</head>
<body>
<div class="form-container">
  <h3 class="card-title mb-4">Crear nuevo grupo</h3>
  <form th:action="@{/admin/grupos/crear}" method="post">
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre del grupo</label>
      <input type="text" class="form-control" id="nombre" name="nombre" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Crear Grupo</button>
  </form>
</div>
<script>
  if (window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);
  }
</script>
</body>
</html>
