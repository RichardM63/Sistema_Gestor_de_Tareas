<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Grupos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #F3F4F6;">
<div th:replace="fragments/header :: header"></div>
<div class="container mt-4">
  <h3 style="color: #1E3A8A;">Grupos de Trabajo</h3>
  <a th:href="@{/admin/grupos/crear}" class="btn btn-primary mb-3" style="background-color: #3B82F6;">Crear Grupo</a>
  <div th:replace="fragments/back :: volver('/admin/dashboard')"></div>
  <table class="table table-bordered bg-white">
    <thead class="table-light">
    <tr>
      <th>Nombre del Grupo</th>
      <th>Miembros</th>
      <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="grupo : ${grupos}">
      <td th:text="${grupo.nombre}"></td>
      <td>
        <ul th:if="${#lists.isEmpty(grupo.miembros)}">
          <li class="text-muted fst-italic">Grupo sin miembros</li>
        </ul>
        <ul th:unless="${#lists.isEmpty(grupo.miembros)}">
          <li th:each="usuario : ${grupo.miembros}" th:text="${usuario.username}"></li>
        </ul>
      </td>
      <td>
        <a th:href="@{'/admin/grupos/editar/' + ${grupo.id}}" class="btn btn-sm btn-secondary">Editar</a>
        <a th:href="@{'/admin/grupos/eliminar/' + ${grupo.id}}" class="btn btn-sm btn-danger">Eliminar</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
