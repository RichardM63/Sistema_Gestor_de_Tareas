<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Asignar Tarea</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h3>Asignar Tarea</h3>
  <form th:action="@{'/admin/tareas/asignar/' + ${tarea.id}}" method="post">
    <div class="mb-3">
      <label>Asignar a Grupo</label>
      <select name="grupoId" class="form-select">
        <option value="" selected>Ninguno</option>
        <option th:each="grupo : ${grupos}" th:value="${grupo.id}" th:text="${grupo.nombre}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label>Asignar a Trabajador</label>
      <select name="trabajadorId" class="form-select">
        <option value="" selected>Ninguno</option>
        <option th:each="trabajador : ${trabajadores}" th:value="${trabajador.id}" th:text="${trabajador.username}"></option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Asignar</button>
  </form>
</div>
<script>
  if (window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);
  }
</script>
</body>
</html>
