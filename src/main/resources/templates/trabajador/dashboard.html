<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Panel del Trabajador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #F3F4F6; }
    .navbar { background-color: #1E3A8A; }
    .navbar-brand, .nav-link { color: #FFFFFF !important; }
    .card-title { color: #1E3A8A; }
    .card { border: 1px solid #9CA3AF; border-radius: 0.75rem; background-color: white; }
    .table th, .table td { vertical-align: middle; }
    .btn-primary { background-color: #3B82F6; border: none; }
    .badge-pendiente { background-color: #FBBF24; }
    .badge-completado { background-color: #10B981; }
    .badge-vencido { background-color: #EF4444; }
    .badge-completado_no_check { background-color: #D1D5DB; color: #1E3A8A; font-weight: bold; } /* Resaltar 'sin check' */
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand">Gestor de Tareas</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" th:href="@{/trabajador/tareas}">Mis Tareas</a></li>
        <li class="nav-item">
          <a class="nav-link" href="#" onclick="document.getElementById('logout-form').submit()">Cerrar sesión</a>
          <form id="logout-form" th:action="@{/logout}" method="post" style="display: none;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Contenido -->
<div class="container mt-4">

  <!-- Tabla de Tareas -->
  <h2 class="mb-3">Mis Tareas</h2>
  <div class="table-responsive">
    <table class="table table-hover bg-white rounded shadow-sm">
      <thead class="table-light">
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Inicio</th>
        <th>Vencimiento</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="tarea : ${tareas}">
        <td th:text="${tarea.nombre}">Tarea</td>
        <td th:text="${tarea.descripcion}">Descripción</td>
        <td th:text="${#temporals.format(tarea.fechaInicio, 'dd/MM/yyyy')}">01/04/2025</td>
        <td th:text="${#temporals.format(tarea.fechaVencimiento, 'dd/MM/yyyy')}">10/04/2025</td>
        <td>
          <span class="badge" th:class="${tarea.estado.getCssClass()}">
          <span th:text="${tarea.estado}">Estado</span>
        </span>
        </td>
        <td>
          <a class="btn btn-sm btn-primary" th:href="@{'/trabajador/tareas/ver/' + ${tarea.id}}">Ver</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Resumen de Tareas -->
  <h2 class="mt-5 mb-4">Resumen de Tareas</h2>
  <div class="row">
    <div class="col-md-4 mb-3">
      <div class="card p-3 text-center">
        <h5 class="card-title">Pendientes</h5>
        <h2 th:text="${pendientes}">0</h2>
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <div class="card p-3 text-center">
        <h5 class="card-title">Completadas</h5>
        <h2 th:text="${completadas}">0</h2>
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <div class="card p-3 text-center">
        <h5 class="card-title">Vencidas</h5>
        <h2 th:text="${vencidas}">0</h2>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
