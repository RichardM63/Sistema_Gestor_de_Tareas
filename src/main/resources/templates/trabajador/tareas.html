<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mis Tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #F3F4F6; }
    .navbar { background-color: #1E3A8A; }
    .navbar-brand, .nav-link { color: #FFFFFF !important; }
    .table th, .table td { vertical-align: middle; }
    .btn-primary { background-color: #3B82F6; border: none; }
    .badge-pendiente { background-color: #FBBF24; }
    .badge-completado { background-color: #10B981; }
    .badge-vencido { background-color: #EF4444; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand">Gestor de Tareas</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/trabajador/dashboard}">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/trabajador/tareas}">Mis Tareas</a></li>
        <li class="nav-item">
          <form th:action="@{/logout}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="nav-link btn btn-link text-white p-0" style="text-decoration: none;">Cerrar sesión</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h2 class="mb-3">Mis Tareas</h2>
  <table class="table table-hover bg-white rounded shadow-sm">
    <thead class="table-light">
    <tr>
      <th>Nombre</th>
      <th>Descripción</th>
      <th>Inicio</th>
      <th>Vencimiento</th>
      <th>Estado</th>
      <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="tarea : ${tareas}">
      <td th:text="${tarea.nombre}">Tarea</td>
      <td th:text="${tarea.descripcion}">Descripción</td>
      <td th:text="${#dates.format(tarea.fechaInicio, 'dd/MM/yyyy')}">01/04/2025</td>
      <td th:text="${#dates.format(tarea.fechaVencimiento, 'dd/MM/yyyy')}">10/04/2025</td>
      <td>
        <span class="badge" th:class="${tarea.estado.getCssClass()}">
          <span th:text="${tarea.estado}">Estado</span>
        </span>
      </td>
      <td>
        <a class="btn btn-sm btn-primary" th:href="@{'/trabajador/tareas/' + ${tarea.id}}">Ver</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
